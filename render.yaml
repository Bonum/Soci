services:
  - type: web
    name: soci
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn soci.api.server:app --host 0.0.0.0 --port $PORT

    envVars:
      # ── Non-secret config (declared here, always applied on deploy) ──────────
      - key: LLM_PROVIDER
        value: gemini          # gemini | groq | claude | ollama

      - key: GITHUB_STATE_BRANCH
        value: simulation-state
      - key: GITHUB_STATE_FILE
        value: state/autosave.json

      # ── Secrets (values set once in Render dashboard, never stored here) ─────
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
